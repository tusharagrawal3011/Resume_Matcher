services:
  - type: web
    name: resume-matcher-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: NODE_ENV=development npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: OLLAMA_LLM_MODEL
        value: llama3
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
      - key: REQUIRE_API_KEY
        value: "true"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "60"

  - type: worker
    name: resume-matcher-worker
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: NODE_ENV=development npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
